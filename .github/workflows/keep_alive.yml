name: "⏰ MANTENER VIVO: Ambas Apps de Streamlit"

on:
  schedule:
    - cron: '0 */12 * * *' # Cada 12 horas automáticamente
  workflow_dispatch:       # Botón para ejecutar manualmente

jobs:
  despertar-apps:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Ejecutar el script de despertar apps
        run: python wake_apps.py
